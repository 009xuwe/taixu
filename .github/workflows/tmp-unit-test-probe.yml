name: TMP Unit Test Probe

# 临时探针：仓库现有三个工作流都只做 assemble，从不执行单元测试。
# 本文件仅用于验证本次改动的单测在云端是否通过，验证后即删除，不进入 PR。
on:
  workflow_dispatch:

jobs:
  unit-test:
    name: testDebugUnitTest (custom_iteration)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Unit Tests for feature:custom_iteration
        run: ./gradlew :feature:custom_iteration:testDebugUnitTest --no-daemon --stacktrace
